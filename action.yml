name: "PR Cost Firewall"
description: "Block cloud cost regressions in PRs: Dockerfile bloat, DB N+1 query loops, unbacked LLM calls"
branding:
  icon: "dollar-sign"
  color: "red"
inputs:
  path:
    description: "Directory path to scan"
    required: false
    default: "."
  threshold:
    description: "Maximum allowable monthly cost delta ($USD) before failing PR"
    required: false
    default: "100.0"
  comment_on_pr:
    description: "Whether to automatically post comment on GitHub PR"
    required: false
    default: "true"
  github_token:
    description: "GITHUB_TOKEN for PR commenting"
    required: false
    default: "${{ github.token }}"
  license_key:
    description: "OrderStream Pro/Enterprise license key (optional)"
    required: false
    default: ""
outputs:
  total_monthly_usd:
    description: "Total estimated monthly AWS/cloud cost delta"
    value: ${{ steps.scan.outputs.total_monthly_usd }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install pr-cost-firewall
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ${{ github.action_path }}
    - name: Run PR Cost Scan
      id: scan
      shell: bash
      env:
        ORDERSTREAM_LICENSE_KEY: ${{ inputs.license_key }}
      run: |
        pr-cost-firewall scan \
          --path "${{ inputs.path }}" \
          --threshold "${{ inputs.threshold }}" \
          --output-comment "pr_cost_comment.md"
    - name: Post PR Cost Comment
      if: inputs.comment_on_pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          if (fs.existsSync('pr_cost_comment.md')) {
            const body = fs.readFileSync('pr_cost_comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }
